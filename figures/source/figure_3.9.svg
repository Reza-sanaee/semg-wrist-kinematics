<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="640" viewBox="0 0 1380 640"><rect width="100%" height="100%" fill="white"/><text x="35" y="45" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#172d38">Why combine CNN and LSTM</text><text x="35" y="100" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">A standalone CNN does not capture</text><text x="35" y="135" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">the complete movement sequence.</text><text x="35" y="170" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">A standalone LSTM is computationally</text><text x="35" y="205" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">demanding and extracts features poorly</text><text x="35" y="240" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">from highly fluctuating raw signals.</text><text x="35" y="275" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">The hybrid architecture combines</text><text x="35" y="310" font-family="Arial" font-size="23" font-weight="normal" text-anchor="start" fill="#172d38">the strengths of both approaches.</text><rect x="530" y="20" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="48" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">Input noise</text><text x="550" y="77" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">GaussianNoise for robustness to sensor noise</text><path d="M 935 93 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="108" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="136" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">1  Conv1D × 2 and L2 regularization</text><text x="550" y="165" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Extraction of high-frequency spatial features</text><path d="M 935 181 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="196" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="224" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">2  BatchNormalization and MaxPooling</text><text x="550" y="253" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Faster convergence and reduced dimensionality</text><path d="M 935 269 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="284" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="312" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">3  SpatialDropout1D  0.2</text><text x="550" y="341" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Prevention of overfitting in spatial maps</text><path d="M 935 357 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="372" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="400" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">4  LSTM  64 units</text><text x="550" y="429" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Complex long-term temporal dependencies</text><path d="M 935 445 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="460" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="488" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">5  GlobalAveragePooling1D</text><text x="550" y="517" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Aggregation of feature maps</text><path d="M 935 533 v 12 m -5 -5 l 5 5 l 5 -5" fill="none" stroke="#497481" stroke-width="2"/><rect x="530" y="548" width="810" height="72" fill="#f2f7f8" stroke="#a1b5bb"/><text x="550" y="576" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172d38">6  Dense  64 to 3</text><text x="550" y="605" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#172d38">Linear regression for the three motion axes</text></svg>