<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="340" viewBox="0 0 1320 340"><rect width="100%" height="100%" fill="white"/><rect x="30" y="35" width="390" height="270" rx="6" fill="#f2f7f8" stroke="#497481" stroke-width="2"/><text x="50" y="78" font-family="Arial" font-size="25" font-weight="bold" text-anchor="start" fill="#172d38">1  Preprocessing</text><text x="50" y="135" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">Butterworth low-pass filter</text><text x="50" y="171" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">(5 Hz) and rectification</text><text x="50" y="207" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">using the absolute value</text><path d="M 428 165 h 26 m -10 -9 l 10 9 l -10 9" stroke="#497481" stroke-width="3" fill="none"/><rect x="470" y="35" width="390" height="270" rx="6" fill="#f2f7f8" stroke="#497481" stroke-width="2"/><text x="490" y="78" font-family="Arial" font-size="25" font-weight="bold" text-anchor="start" fill="#172d38">2  Windowing strategy</text><text x="490" y="135" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">600-sample windows</text><text x="490" y="171" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">(300 milliseconds)</text><text x="490" y="207" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">Longer temporal context</text><text x="490" y="243" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">for muscular contraction</text><path d="M 868 165 h 26 m -10 -9 l 10 9 l -10 9" stroke="#497481" stroke-width="3" fill="none"/><rect x="910" y="35" width="390" height="270" rx="6" fill="#f2f7f8" stroke="#497481" stroke-width="2"/><text x="930" y="78" font-family="Arial" font-size="25" font-weight="bold" text-anchor="start" fill="#172d38">3  Baseline architecture</text><text x="930" y="135" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">Hybrid CNN-LSTM</text><text x="930" y="171" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">Huber loss to reduce</text><text x="930" y="207" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">sudden jumps at</text><text x="930" y="243" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">movement boundaries</text></svg>