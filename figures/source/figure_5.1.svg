<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="675" viewBox="0 0 1420 675"><rect width="100%" height="100%" fill="white"/><text x="30" y="45" font-family="Arial" font-size="30" font-weight="bold" text-anchor="start" fill="#172d38">Four phases of scientific development</text><text x="30" y="92" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#172d38">The project progressed from simple classification to accurate continuous estimation.</text><text x="35" y="155" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#172d38">Architectural development</text><text x="35" y="205" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">A natural balance between CNN</text><text x="35" y="242" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">for spatial features and LSTM</text><text x="35" y="279" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">for temporal sequences.</text><text x="735" y="155" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#172d38">Transition to continuous estimation</text><text x="735" y="205" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">Overcoming the limitations of stepwise</text><text x="735" y="242" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">labels and obtaining smooth</text><text x="735" y="279" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">biomechanical trajectories using</text><text x="735" y="316" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">Gaussian filtering.</text><text x="35" y="415" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#172d38">Scientific transparency</text><text x="35" y="465" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">Demonstrating covariate shift in EMG</text><text x="35" y="502" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">and consciously selecting the</text><text x="35" y="539" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">intra-subject approach for</text><text x="35" y="576" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">the highest attainable accuracy.</text><text x="735" y="415" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#172d38">Biomechanical engineering</text><text x="735" y="465" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">Introducing gain calibration to</text><text x="735" y="502" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">stabilize extreme motion values in</text><text x="735" y="539" font-family="Arial" font-size="25" font-weight="normal" text-anchor="start" fill="#172d38">real-time prosthesis implementations.</text></svg>