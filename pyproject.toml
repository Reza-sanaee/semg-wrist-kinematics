[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semg-wrist-kinematics"
version = "1.0.0"
description = "Bachelor's degree project on continuous wrist kinematics estimation using sEMG"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
training = ["tensorflow"]
visualization = ["vpython"]
notebook = ["jupyterlab", "ipykernel"]

[project.scripts]
wrist-kinematics = "wrist_kinematics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
